services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uk-wind-forecast-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    container_name: uk-wind-forecast-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
